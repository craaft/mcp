name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath -ldflags="-s -w" \
            -o /tmp/craaft-mcp .
          ls -la /tmp/craaft-mcp

      - name: smoke test
        run: |
          PORT=9090 CRAAFT_BASE_URL=https://craaft.io /tmp/craaft-mcp > /tmp/mcp.log 2>&1 &
          MCP_PID=$!
          trap 'kill -TERM $MCP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:9090/healthz > /dev/null 2>&1; then
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "--- mcp log ---"; cat /tmp/mcp.log; exit 1
